
name: Generate Activity Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/blank.yml
      - scripts/render_activity.py

permissions:
  contents: write

concurrency:
  group: activity-signal-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily SVG from real GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/render_activity.py
          test -s dist/activity-signal.svg
          if grep -q 'SYNTHETIC ACTIVITY DATA' dist/activity-signal.svg; then
            echo 'Refusing to publish demo data'
            exit 1
          fi

      - name: Publish to existing activity-signal branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-signal
          build_dir: dist
          commit_message: 'chore: refresh Activity Signal v2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

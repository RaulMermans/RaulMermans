name: Generate Activity Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/blank.yml

permissions:
  contents: write

concurrency:
  group: activity-signal-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Activity Signal SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PYTHON'
          from __future__ import annotations

          import json
          import math
          import os
          import sys
          import urllib.request
          from datetime import date
          from html import escape
          from pathlib import Path

          GRAPHQL = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          WIDTH = 1600
          HEIGHT = 560

          GRID_X = 140
          GRID_Y = 182
          CELL = 21
          GAP = 10
          STEP_X = CELL + GAP
          STEP_Y = CELL + GAP
          N_WEEKS = 53

          LOGIN_DEFAULT = "RaulMermans"

          PALETTE = {
              "NONE": "#0d1d30",
              "FIRST_QUARTILE": "#16415b",
              "SECOND_QUARTILE": "#1d6d8d",
              "THIRD_QUARTILE": "#27a8d1",
              "FOURTH_QUARTILE": "#8af3ff",
          }

          def github_weeks(login: str):
              token = os.getenv("GH_TOKEN", "")
              if not token:
                  raise RuntimeError("Missing GH_TOKEN")
              body = json.dumps({
                  "query": GRAPHQL,
                  "variables": {"login": login}
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "activity-signal-generator"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)

              if payload.get("errors"):
                  raise RuntimeError(f"GitHub GraphQL error: {payload['errors']}")

              cal = payload["data"]["user"]["contributionsCollection"]["contributionCalendar"]
              return cal["weeks"], cal["totalContributions"]

          def normalize_weeks(raw_weeks):
              weeks = []
              for raw_week in raw_weeks[-N_WEEKS:]:
                  days = [dict(date="", contributionCount=0, contributionLevel="NONE") for _ in range(7)]
                  for d in raw_week.get("contributionDays", []):
                      weekday = (date.fromisoformat(d["date"]).weekday() + 1) % 7  # sunday-first
                      level = d.get("contributionLevel", "NONE")
                      if level not in PALETTE:
                          level = "NONE"
                      days[weekday] = {
                          "date": d["date"],
                          "contributionCount": int(d.get("contributionCount", 0)),
                          "contributionLevel": level,
                      }
                  weeks.append(days)

              if len(weeks) < N_WEEKS:
                  pad = [[dict(date="", contributionCount=0, contributionLevel="NONE") for _ in range(7)] for _ in range(N_WEEKS - len(weeks))]
                  weeks = pad + weeks

              return weeks[-N_WEEKS:]

          def week_totals(weeks):
              return [sum(day["contributionCount"] for day in week) for week in weeks]

          def date_range(weeks):
              first = None
              last = None
              for w in weeks:
                  for d in w:
                      if d["date"]:
                          if first is None:
                              first = d["date"]
                          last = d["date"]
              return first or "", last or ""

          def month_labels(weeks):
              out = []
              seen = set()
              month_names = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"]
              for i, week in enumerate(weeks):
                  for d in week:
                      if d["date"]:
                          dt = date.fromisoformat(d["date"])
                          key = (dt.year, dt.month)
                          if key not in seen:
                              seen.add(key)
                              out.append((i, month_names[dt.month - 1]))
                          break
              return out

          def cluster_points(weeks):
              totals = week_totals(weeks)
              points = []
              segments = 6
              seg_size = max(1, N_WEEKS // segments)
              for s in range(segments):
                  lo = s * seg_size
                  hi = N_WEEKS if s == segments - 1 else min(N_WEEKS, (s + 1) * seg_size)
                  best_col = None
                  best_total = -1
                  best_row = 3
                  for col in range(lo, hi):
                      total = totals[col]
                      if total <= 0:
                          continue
                      best_day_row = 3
                      best_day_val = -1
                      for row in range(7):
                          val = weeks[col][row]["contributionCount"]
                          if val > best_day_val:
                              best_day_val = val
                              best_day_row = row
                      if total > best_total:
                          best_total = total
                          best_col = col
                          best_row = best_day_row
                  if best_col is not None:
                      points.append((best_col, best_row, best_total))
              return points

          def build_arc_path(points):
              if len(points) < 2:
                  return ""
              coords = []
              for col, row, _ in points:
                  x = GRID_X + col * STEP_X + CELL / 2
                  y = GRID_Y + row * STEP_Y + CELL / 2
                  coords.append((x, y))

              parts = [f"M {coords[0][0]:.1f} {coords[0][1]:.1f}"]
              for (x0, y0), (x1, y1) in zip(coords, coords[1:]):
                  mx = (x0 + x1) / 2
                  cy = min(y0, y1) - 90
                  parts.append(f"Q {mx:.1f} {cy:.1f} {x1:.1f} {y1:.1f}")
              return " ".join(parts), coords

          def tile_animation_times(col):
              # reveal left -> right, then hide right -> left
              reveal_start = 0.09 + col * 0.0078
              reveal_end = reveal_start + 0.035
              hide_start = 0.70 + (N_WEEKS - 1 - col) * 0.0054
              hide_end = hide_start + 0.035
              hide_end = min(hide_end, 0.97)
              return reveal_start, reveal_end, hide_start, hide_end

          def tile_opacity_for_count(count):
              if count <= 0:
                  return 0.22
              if count < 3:
                  return 0.62
              if count < 10:
                  return 0.76
              return 0.95

          def svg(weeks, login, total_contributions):
              login_upper = escape(login.upper())
              first_date, last_date = date_range(weeks)
              months = month_labels(weeks)
              totals = week_totals(weeks)
              max_total = max(max(totals), 1)
              path_data, arc_coords = build_arc_path(cluster_points(weeks))

              lines = []
              add = lines.append

              add(f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {WIDTH} {HEIGHT}" width="{WIDTH}" height="{HEIGHT}" role="img" aria-labelledby="title desc">
<title id="title">Activity Signal — {login_upper}</title>
<desc id="desc">Animated GitHub contribution signal generated from real public contribution history.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#030911"/>
    <stop offset="55%" stop-color="#06111f"/>
    <stop offset="100%" stop-color="#02070f"/>
  </linearGradient>

  <radialGradient id="glowPlanet" cx="78%" cy="28%" r="34%">
    <stop offset="0%" stop-color="#5cbcff" stop-opacity="0.18"/>
    <stop offset="45%" stop-color="#2d74be" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#07111d" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="frameGlow" x1="0" x2="1">
    <stop offset="0%" stop-color="#1e84d6"/>
    <stop offset="50%" stop-color="#62ddff"/>
    <stop offset="100%" stop-color="#1e84d6"/>
  </linearGradient>

  <linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0%" stop-color="#4ad7ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#8af3ff" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#4ad7ff" stop-opacity="0"/>
  </linearGradient>

  <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <filter id="tinyGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>

  <style>
    .title {{
      font: 700 24px Inter, Arial, sans-serif;
      letter-spacing: 6px;
      fill: #f2f7ff;
    }}
    .title-accent {{
      fill: #4ecaff;
    }}
    .kicker {{
      font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 4px;
      fill: #7fa3bc;
      text-transform: uppercase;
    }}
    .small {{
      font: 500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 3.5px;
      fill: #6488a3;
      text-transform: uppercase;
    }}
    .month {{
      font: 500 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 2px;
      fill: #93b0c6;
      text-transform: uppercase;
    }}
    .tile-on {{
      animation: tilePulse 18s linear infinite;
    }}
    .node {{
      animation: nodePulse 4.5s ease-in-out infinite;
    }}
    .scan {{
      animation: sweepMove 18s linear infinite;
    }}
    .arc-shimmer {{
      stroke-dasharray: 16 22;
      animation: shimmer 7s linear infinite;
    }}
    .star {{
      animation: starTwinkle 5s ease-in-out infinite;
    }}
    @keyframes shimmer {{
      from {{ stroke-dashoffset: 0; }}
      to {{ stroke-dashoffset: -220; }}
    }}
    @keyframes nodePulse {{
      0%, 100% {{ opacity: .45; transform: scale(1); }}
      50% {{ opacity: 1; transform: scale(1.25); }}
    }}
    @keyframes starTwinkle {{
      0%, 100% {{ opacity: .15; }}
      50% {{ opacity: .75; }}
    }}
    @keyframes sweepMove {{
      0%, 100% {{ transform: translateX(-90px); opacity: 0; }}
      18% {{ opacity: .22; }}
      50% {{ opacity: .34; }}
      82% {{ opacity: .22; }}
      100% {{ transform: translateX(1430px); opacity: 0; }}
    }}
    @keyframes tilePulse {{
      0%, 100% {{ filter: none; }}
      50% {{ filter: url(#tinyGlow); }}
    }}
    @media (prefers-reduced-motion: reduce) {{
      .scan, .arc-shimmer, .node, .tile-on, .star {{ animation: none !important; }}
    }}
  </style>
</defs>

<rect width="{WIDTH}" height="{HEIGHT}" fill="url(#bg)"/>
<rect width="{WIDTH}" height="{HEIGHT}" fill="url(#glowPlanet)"/>
''')

              # stars
              stars = [
                  (210, 52, 1.2, 0.35, "0s"), (318, 80, 1.4, 0.22, "1s"), (447, 38, 1.0, 0.28, "2s"),
                  (590, 66, 1.6, 0.25, "1.5s"), (712, 55, 1.1, 0.22, "0.8s"), (840, 40, 1.3, 0.32, "1.2s"),
                  (1020, 72, 1.4, 0.20, "1.9s"), (1170, 50, 1.0, 0.22, "0.4s"), (1320, 44, 1.2, 0.24, "1.3s")
              ]
              for x, y, r, op, delay in stars:
                  add(f'<circle class="star" cx="{x}" cy="{y}" r="{r}" fill="#bfeaff" opacity="{op}" style="animation-delay:{delay}"/>')

              # orbital background arcs
              add('''
<path d="M 1020 80 Q 1245 -5 1440 72 Q 1518 104 1490 155 Q 1450 230 1270 235 Q 1120 238 1045 198 Q 965 158 1010 112 Q 1040 84 1100 76" fill="none" stroke="#173554" stroke-width="1.2" opacity=".55"/>
<path d="M 1075 42 Q 1270 110 1492 92" fill="none" stroke="#1f4c75" stroke-width="1.1" opacity=".36" stroke-dasharray="4 8"/>
<path d="M 1128 27 Q 1272 210 1387 270" fill="none" stroke="#143551" stroke-width="1" opacity=".26"/>
''')

              # frame
              add(f'''
<path d="M110 70 H1490 V470 H110 Z" fill="none" stroke="#173957" stroke-width="1.2" opacity=".9"/>
<path d="M110 104 H1490" stroke="#16364f" stroke-width="1"/>
<path d="M110 70 H152 V105" stroke="url(#frameGlow)" stroke-width="1.4" fill="none"/>
<path d="M1490 70 H1448 V105" stroke="url(#frameGlow)" stroke-width="1.4" fill="none"/>
<path d="M110 470 H152 V435" stroke="#2a92d8" stroke-width="1.3" fill="none" opacity=".85"/>
<path d="M1490 470 H1448 V435" stroke="#2a92d8" stroke-width="1.3" fill="none" opacity=".85"/>
''')

              # header text
              add(f'''
<text x="150" y="122" class="title">ACTIVITY <tspan class="title-accent">SIGNAL</tspan></text>
<text x="150" y="150" class="kicker">public contribution history</text>

<text x="1415" y="123" text-anchor="end" class="kicker">{login_upper} / AI ENGINEER</text>
<text x="1415" y="150" text-anchor="end" class="small">generated from GitHub data</text>
''')

              # month labels
              for col, label in months:
                  x = GRID_X + col * STEP_X
                  add(f'<text x="{x}" y="176" class="month">{label}</text>')

              # reveal sweep
              add(f'''
<rect x="{GRID_X - 44}" y="{GRID_Y - 18}" width="95" height="260" fill="url(#sweep)" class="scan"/>
''')

              # contribution tiles
              for col in range(N_WEEKS):
                  for row in range(7):
                      day = weeks[col][row]
                      count = day["contributionCount"]
                      level = day["contributionLevel"]
                      fill = PALETTE[level] if count > 0 else PALETTE["NONE"]
                      x = GRID_X + col * STEP_X
                      y = GRID_Y + row * STEP_Y
                      target_opacity = tile_opacity_for_count(count)
                      reveal_start, reveal_end, hide_start, hide_end = tile_animation_times(col)
                      title = f'{escape(day["date"])}: {count} contributions' if day["date"] else 'No visible contribution data'

                      add(f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" rx="4" fill="{fill}" opacity="0">')
                      add(f'<title>{title}</title>')
                      add(
                          f'<animate attributeName="opacity" dur="18s" repeatCount="indefinite" '
                          f'values="0;0;{target_opacity};{target_opacity};0;0" '
                          f'keyTimes="0;{reveal_start:.4f};{reveal_end:.4f};{hide_start:.4f};{hide_end:.4f};1" />'
                      )
                      add('</rect>')

                      # subtle glow for active tiles
                      if count > 0:
                          add(f'<rect class="tile-on" x="{x}" y="{y}" width="{CELL}" height="{CELL}" rx="4" fill="{fill}" opacity="0" filter="url(#tinyGlow)">')
                          add(
                              f'<animate attributeName="opacity" dur="18s" repeatCount="indefinite" '
                              f'values="0;0;0.18;0.18;0;0" '
                              f'keyTimes="0;{reveal_start:.4f};{reveal_end:.4f};{hide_start:.4f};{hide_end:.4f};1" />'
                          )
                          add('</rect>')

              # cluster arcs instead of middle wire
              if path_data:
                  add(f'<path d="{path_data}" fill="none" stroke="#1d5e8b" stroke-width="8" opacity=".10" filter="url(#softGlow)"/>')
                  add(f'<path d="{path_data}" fill="none" stroke="#61d9ff" stroke-width="1.8" opacity=".65" class="arc-shimmer"/>')
                  add(f'<path d="{path_data}" fill="none" stroke="#9af2ff" stroke-width="0.8" opacity=".92"/>')

                  for i, (x, y) in enumerate(arc_coords):
                      delay = f"{(i * 0.45):.2f}s"
                      add(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="10" fill="#55dfff" opacity=".16" filter="url(#softGlow)"/>')
                      add(f'<circle class="node" cx="{x:.1f}" cy="{y:.1f}" r="4.4" fill="#d7fbff" opacity=".85" style="animation-delay:{delay}"/>')

              # bottom labels only, minimal
              add(f'''
<line x1="{GRID_X}" y1="437" x2="{GRID_X + STEP_X * 53 - GAP}" y2="437" stroke="#14324a" stroke-width="1"/>
<text x="{GRID_X}" y="455" class="small">{first_date} — {last_date}</text>
<text x="{GRID_X + STEP_X * 53 - GAP}" y="455" text-anchor="end" class="small">{total_contributions:,} public contributions</text>
''')

              add('</svg>')
              return "\n".join(lines)

          def main():
              login = os.environ.get("GITHUB_REPOSITORY_OWNER", LOGIN_DEFAULT)
              raw_weeks, total_contributions = github_weeks(login)
              weeks = normalize_weeks(raw_weeks)
              out = svg(weeks, login, total_contributions)

              out_path = Path("dist/activity-signal.svg")
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text(out, encoding="utf-8")
              print(f"Generated {out_path} ({out_path.stat().st_size:,} bytes)")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print(f"ERROR: {exc}", file=sys.stderr)
                  sys.exit(1)
          PYTHON

      - name: Publish animated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-signal
          build_dir: dist
          commit_message: 'chore: update Activity Signal'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

